<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#bfeaf4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="플래너">
<title>플래너</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="desk">
  <main class="win" id="win">
    <header class="titlebar"><h1 id="winTitle">할 일</h1></header>

    <div class="toolbar">
      <button class="sq" id="btnPrev" aria-label="전날" title="전날"></button>
      <button class="sq" id="btnNext" aria-label="다음날" title="다음날"></button>
      <button class="sq gap" id="btnMenu" aria-label="보기 메뉴" title="보기 메뉴"></button>
      <button class="sq" id="btnSync" aria-label="동기화" title="Microsoft To Do 동기화"></button>
      <label class="pill datepill" id="datePill">
        <span id="dateText"></span>
        <input type="date" id="dateInput" aria-label="날짜 선택">
      </label>
    </div>

    <section class="content" id="view"></section>

    <nav class="tabbar" id="tabbar">
      <button class="pill tab" data-tab="tasks"></button>
      <button class="pill tab" data-tab="timer"></button>
      <button class="pill tab" data-tab="ledger"></button>
      <button class="pill tab" data-tab="settings"></button>
    </nav>
  </main>
</div>

<div id="sheetRoot"></div>
<div id="toast" class="toast" role="status"></div>

<script src="config.js"></script>
<script src="vendor/msal-browser.min.js"></script>
<script src="core.js"></script>
<script src="sync.js"></script>
<script src="app.js"></script>
</body>
</html>
